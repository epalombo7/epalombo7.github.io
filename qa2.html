<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css?v=14">
<style>body{padding:10px}.g{display:grid;gap:8px}iframe{border:0;display:block}.n{font:12px sans-serif;color:#aaa}</style>
<div class="g" id="g"></div>
<script>var p=new URLSearchParams(location.search),v=p.get("v"),w=+p.get("w"),c=+p.get("c"),ts=(p.get("t")||"").split(",").map(Number);var g=document.getElementById("g");g.style.gridTemplateColumns="repeat("+c+","+w+"px)";
ts.forEach(function(t){var d=document.createElement("div");d.setAttribute("aria-hidden","true");d.innerHTML='<div class="n">'+v+' t='+t+'</div><iframe aria-hidden="true" tabindex="-1" width="'+w+'" height="'+Math.round(w*9/16)+'" src="anim/'+v+'.html?r='+Math.random()+'#t='+t*1000+'"></iframe>';g.appendChild(d)})</script>
