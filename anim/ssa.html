<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub-Saharan Africa outlook: 1-minute outlook</title>
<link rel="stylesheet" href="../style.css?v=12">
<style>
.anim{--teal:#5fa8a0;--sand:#d9c3a0;--slate:#34424f;--deep:#1b242d;position:relative;aspect-ratio:16/9;max-width:100%;margin:0 auto;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.anim .s{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6% 8% 9%;opacity:0;animation:sl 60s linear 1 both;animation-delay:calc(var(--i)*6s)}
.anim .s.last{animation-name:sl-last}
.anim .k{margin:0 0 .5em;font-size:clamp(.65rem,2.2vw,.8rem);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.anim .t{margin:0;font-size:clamp(.95rem,3.8vw,1.85rem);line-height:1.25;font-weight:600;max-width:15em}
.anim .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:1em}
.anim .btn.p{background:var(--navy);color:var(--on-accent);border-color:var(--navy)}
.anim .sig{height:48px;width:auto;aspect-ratio:398/262;align-self:flex-start;margin:0 0 .8em}
.anim svg{position:absolute;right:4%;top:11%;width:40%;height:auto;pointer-events:none}
.anim .bg{fill:var(--slate);opacity:.4}
.anim .dk{fill:var(--deep)}.anim .sl{fill:var(--slate)}.anim .sd{fill:var(--sand)}.anim .cl{fill:var(--navy)}.anim .tl{fill:var(--teal)}.anim .sf{fill:var(--surface)}.anim .mu{fill:var(--muted)}
.anim .fg{fill:var(--sand);opacity:.2}
.anim .st{fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anim .sts{stroke:var(--sand)}.anim .stt{stroke:var(--teal)}.anim .stm{stroke:var(--muted)}.anim .stl{stroke:var(--line)}
.anim .base{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.anim .grid{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.anim .l{fill:none;stroke:var(--navy);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dr 3s ease-in-out both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
.anim .ref{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:3 3;stroke-linecap:round;stroke-linejoin:round}
.anim .tx{fill:var(--muted);font:600 9px system-ui,sans-serif}
.anim .q{fill:var(--navy);font:700 20px system-ui,sans-serif;text-anchor:middle}
.anim .in{animation:in .7s ease-out both;animation-delay:calc(var(--i)*6s + var(--d,.3s))}
.anim .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
.anim .area{animation:in 1s ease-out both;animation-delay:calc(var(--i)*6s + 3.2s)}
.anim .fl{animation:fl 3.4s ease-in-out infinite alternate}
.anim .dx{animation:dx 7s ease-in-out infinite alternate}
.anim .dy{animation:dx 9s ease-in-out infinite alternate-reverse}
.anim .sw{transform-box:fill-box;transform-origin:50% 0;animation:sw 3s ease-in-out infinite alternate}
.anim .sp{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
.anim .spr{animation-direction:reverse;animation-duration:8s}
.anim .hd{transform-box:fill-box;transform-origin:50% 100%;animation:spin 4s linear infinite}
.anim .hh{animation-duration:48s}
.anim .pu{transform-box:fill-box;transform-origin:center;animation:pu 2s ease-in-out infinite}
.anim .rise{transform-box:fill-box;transform-origin:center;animation:rise 3s ease-out infinite;animation-delay:var(--w,0s)}
.anim .fall{animation:fall 2.4s ease-in infinite;animation-delay:var(--w,0s)}
.anim .flow{stroke-dasharray:3 3;animation:flow 1s linear infinite}
.anim .bk{animation:bk 2.6s ease-in-out infinite;animation-delay:var(--w,0s)}
.anim .tv{offset-rotate:0deg;animation:tv 3s ease-in-out both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
.anim .sdt{transform-box:fill-box;transform-origin:50% 100%;animation:sdt 5s linear infinite}
.anim .sdb{transform-box:fill-box;transform-origin:50% 100%;animation:sdb 5s linear infinite}
.anim .bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--navy);transform-origin:left;animation:fill 60s linear 1 both}
.anim .rp{position:absolute;right:12px;bottom:12px;z-index:2;font:inherit;font-size:.8rem;padding:2px 12px;cursor:pointer;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--navy)}
@keyframes sl{0%{opacity:0;transform:translateY(8px)}1.5%,8.5%{opacity:1;transform:none}10%,100%{opacity:0}}
@keyframes sl-last{0%{opacity:0;transform:translateY(8px)}1.5%,100%{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes fl{to{transform:translateY(-3px)}}
@keyframes dx{to{transform:translateX(9px)}}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pu{50%{transform:scale(1.18);opacity:.6}}
@keyframes rise{from{opacity:.7;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-14px) scale(1.5)}}
@keyframes fall{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
@keyframes flow{to{stroke-dashoffset:-6}}
@keyframes bk{50%{opacity:.3}}
@keyframes tv{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes sdt{to{transform:scaleY(0)}}
@keyframes sdb{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.anim.off *{animation:none!important}
@media (prefers-reduced-motion:reduce){.anim{aspect-ratio:auto}.anim .s{position:static;opacity:1;animation:none;padding:18px 20px;border-bottom:1px solid var(--line)}.anim svg{position:static;width:min(260px,100%);margin-top:8px}.anim .l{stroke-dashoffset:0}.anim .tv{offset-distance:100%}.anim *{animation:none!important}.anim .bar,.anim .rp{display:none}}
svg{overflow:visible}
body{background:transparent}
.anim .num{fill:var(--text);font:700 11px system-ui,sans-serif;text-anchor:middle}
.anim .gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 1.2s cubic-bezier(.3,1.2,.5,1) both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
@keyframes gr{from{transform:scaleY(0)}to{transform:none}}</style>
</head>
<body>
<figure class="anim" id="a" aria-label="One-minute animated outlook for Sub-Saharan Africa">
<div class="s" style="--i:0"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:.3s"><path class="sl" d="M58 14C70 10 84 12 92 18C100 16 110 20 112 30C118 34 120 42 116 50C112 58 110 68 102 78C96 86 88 92 82 90C78 82 76 72 70 64C64 56 54 52 46 46C40 40 42 30 48 22C50 18 54 16 58 14Z"/></g><circle class="cl pu pop" cx="70" cy="40" r="3" style="--d:1.0s"/><circle class="cl pu pop" cx="84" cy="52" r="3" style="--d:1.2s"/><circle class="cl pu pop" cx="96" cy="46" r="3" style="--d:1.4s"/><circle class="cl pu pop" cx="78" cy="64" r="3" style="--d:1.6s"/><circle class="cl pu pop" cx="90" cy="70" r="3" style="--d:1.8s"/><circle class="cl pu pop" cx="62" cy="34" r="3" style="--d:2.0s"/><circle class="cl pu pop" cx="100" cy="30" r="3" style="--d:2.2s"/><circle class="cl pu pop" cx="88" cy="30" r="3" style="--d:2.4s"/></svg><p class="k">Sub-Saharan Africa</p><p class="t">Growth holds near 4%, but a new energy shock is testing the region.</p></div>
<div class="s" style="--i:1"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><path class="base" d="M8 80H152"/><text class="tx" x="80" y="4" text-anchor="middle">GDP growth, %; change vs January in coral</text><rect class="sl gr" x="17.0" y="47.4" width="18" height="32.6" rx="3" style="--d:0.5s"/><text class="num in" x="26.0" y="44.4" style="--d:1.1s;font-size:9px">3.8</text><text class="tx" x="26.0" y="90" text-anchor="middle">2024</text><rect class="sd gr" x="44.0" y="44.9" width="18" height="35.1" rx="3" style="--d:0.8s"/><text class="num in" x="53.0" y="41.9" style="--d:1.4s;font-size:9px">4.1</text><text class="tx" x="53.0" y="90" text-anchor="middle">2025e</text><rect class="cl gr" x="71.0" y="45.7" width="18" height="34.3" rx="3" style="--d:1.2s"/><text class="num in" x="80.0" y="42.7" style="--d:1.8s;font-size:9px">4.0</text><text class="tx" x="80.0" y="90" text-anchor="middle">2026f</text><text class="tx in" x="80.0" y="99" text-anchor="middle" style="--d:2.6s;fill:var(--navy)">−0.3</text><rect class="cl gr" x="98.0" y="42.3" width="18" height="37.7" rx="3" style="--d:1.5s"/><text class="num in" x="107.0" y="39.3" style="--d:2.1s;font-size:9px">4.4</text><text class="tx" x="107.0" y="90" text-anchor="middle">2027f</text><text class="tx in" x="107.0" y="99" text-anchor="middle" style="--d:2.9s;fill:var(--navy)">−0.1</text><rect class="cl gr" x="125.0" y="41.4" width="18" height="38.6" rx="3" style="--d:1.9s"/><text class="num in" x="134.0" y="38.4" style="--d:2.5s;font-size:9px">4.5</text><text class="tx" x="134.0" y="90" text-anchor="middle">2028f</text><text class="tx in" x="134.0" y="99" text-anchor="middle" style="--d:3.3s;fill:var(--navy)">new</text></svg><p class="k">The full projection</p><p class="t">4.0% in 2026, cut 0.3 point since January, then 4.4% in 2027 and 4.5% in 2028.</p></div>
<div class="s" style="--i:2"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><g class="in" style="--d:.3s"><rect class="dk" x="24" y="40" width="40" height="44" rx="3"/><rect class="sl" x="30" y="30" width="10" height="12"/><circle class="mu rise" cx="35" cy="26" r="4" style="opacity:.5"/><circle class="mu rise" cx="35" cy="26" r="3" style="--w:1.4s;opacity:.5"/></g><g class="in" style="--d:.9s"><path class="base" d="M82 84H150M82 84V22"/><path class="l" pathLength="100" d="M86 74L104 70L118 44L132 36L146 30" style="--d:1.2s"/><g class="tv" style="offset-path:path('M86 74L104 70L118 44L132 36L146 30');--d:1.2s"><circle r="3.6" class="cl"/></g><text class="tx" x="116" y="16" text-anchor="middle">Oil price</text></g></svg><p class="k">The shock</p><p class="t">The Middle East conflict pushed oil to about $94 a barrel. Most of the region imports energy.</p></div>
<div class="s" style="--i:3"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><path class="base" d="M30 84H130"/><text class="tx" x="80" y="6" text-anchor="middle">Illustration</text><rect class="sd gr" x="46" y="42.5" width="24" height="41.5" rx="3" style="--d:0.6s"/><text class="num in" x="58" y="38.5" style="--d:1.4s">+</text><text class="tx" x="58" y="95" text-anchor="middle">Exporters</text><rect class="cl gr" x="90" y="57.6" width="24" height="26.4" rx="3" style="--d:1.2s"/><text class="num in" x="102" y="53.6" style="--d:2.0s">−</text><text class="tx" x="102" y="95" text-anchor="middle">Importers</text></svg><p class="k">Two sides</p><p class="t">A few oil exporters gain. Gold and copper exporters had a strong 2025. Importers pay more.</p></div>
<div class="s" style="--i:4"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><g class="pop" style="--d:0.6s"><circle cx="20" cy="46" r="15" class="sf st"/><text class="q" x="20" y="53" style="font-size:18px">↑</text></g><text class="tx in" x="20" y="78" text-anchor="middle" style="--d:1.0s">Fertilizer</text><g class="pop" style="--d:1.1s"><circle cx="80" cy="46" r="15" class="sf st"/><text class="q" x="80" y="53" style="font-size:18px">↑</text></g><text class="tx in" x="80" y="78" text-anchor="middle" style="--d:1.5s">Food</text><g class="pop" style="--d:1.6s"><circle cx="140" cy="46" r="15" class="sf st"/><text class="q" x="140" y="53" style="font-size:18px">↑</text></g><text class="tx in" x="140" y="78" text-anchor="middle" style="--d:2.0s">Prices</text></svg><p class="k">The squeeze</p><p class="t">The biggest pressure comes through food, as fertilizer gets scarcer and dearer.</p></div>
<div class="s" style="--i:5"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><path class="base" d="M30 84H130"/><text class="tx" x="80" y="6" text-anchor="middle">2026 growth</text><rect class="sd gr" x="46" y="46.3" width="24" height="37.7" rx="3" style="--d:0.6s"/><text class="num in" x="58" y="42.3" style="--d:1.4s">4.0%</text><text class="tx" x="58" y="95" text-anchor="middle">Economy</text><rect class="cl gr" x="90" y="68.9" width="24" height="15.1" rx="3" style="--d:1.2s"/><text class="num in" x="102" y="64.9" style="--d:2.0s">1.6%</text><text class="tx" x="102" y="95" text-anchor="middle">Per person</text></svg><p class="k">Per person</p><p class="t">With fast population growth, income per person rises only about 1.6% in 2026.</p></div>
<div class="s" style="--i:6"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><g class="pop" style="--d:0.6s"><circle cx="20" cy="46" r="15" class="sf st"/><text class="q" x="20" y="53" style="font-size:18px">!</text></g><text class="tx in" x="20" y="78" text-anchor="middle" style="--d:1.0s">Conflict</text><g class="pop" style="--d:1.1s"><circle cx="60" cy="46" r="15" class="sf st"/><text class="q" x="60" y="53" style="font-size:18px">!</text></g><text class="tx in" x="60" y="78" text-anchor="middle" style="--d:1.5s">Ebola</text><g class="pop" style="--d:1.6s"><circle cx="100" cy="46" r="15" class="sf st"/><text class="q" x="100" y="53" style="font-size:18px">!</text></g><text class="tx in" x="100" y="78" text-anchor="middle" style="--d:2.0s">Less aid</text><g class="pop" style="--d:2.1s"><circle cx="140" cy="46" r="15" class="sf st"/><text class="q" x="140" y="53" style="font-size:18px">!</text></g><text class="tx in" x="140" y="78" text-anchor="middle" style="--d:2.5s">Debt costs</text></svg><p class="k">The risks</p><p class="t">Renewed conflict, Ebola in the DRC and Uganda, falling aid and higher borrowing costs.</p></div>
<div class="s" style="--i:7"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><path class="base" d="M30 84H130"/><text class="tx" x="80" y="6" text-anchor="middle">2026 growth</text><rect class="sd gr" x="46" y="46.3" width="24" height="37.7" rx="3" style="--d:0.6s"/><text class="num in" x="58" y="42.3" style="--d:1.4s">4.0%</text><text class="tx" x="58" y="95" text-anchor="middle">SSA</text><rect class="cl gr" x="90" y="33.1" width="24" height="50.9" rx="3" style="--d:1.2s"/><text class="num in" x="102" y="29.1" style="--d:2.0s">5.4%</text><text class="tx" x="102" y="95" text-anchor="middle">LICs</text></svg><p class="k">Versus LICs</p><p class="t">The region’s low-income countries grow faster, at 5.4%, but from a far lower base.</p></div>
<div class="s" style="--i:8"><svg viewBox="0 0 160 100" aria-hidden="true"><g class="in" style="--d:0s"><ellipse class="bg" cx="80" cy="52" rx="76" ry="44"/></g><g class="pop" style="--d:0.6s"><circle cx="20" cy="46" r="15" class="sf st"/><text class="q" x="20" y="53" style="font-size:18px">✓</text></g><text class="tx in" x="20" y="78" text-anchor="middle" style="--d:1.0s">Protect</text><g class="pop" style="--d:1.1s"><circle cx="80" cy="46" r="15" class="sf st"/><text class="q" x="80" y="53" style="font-size:18px">✓</text></g><text class="tx in" x="80" y="78" text-anchor="middle" style="--d:1.5s">Stabilize</text><g class="pop" style="--d:1.6s"><circle cx="140" cy="46" r="15" class="sf st"/><text class="q" x="140" y="53" style="font-size:18px">✓</text></g><text class="tx in" x="140" y="78" text-anchor="middle" style="--d:2.0s">Invest</text></svg><p class="k">Priorities</p><p class="t">Protect people, keep stability, and draw in private investment.</p></div>
<div class="s last" style="--i:9"><img src="../sig.svg?v=6" alt="Edoardo Palombo signature" class="sig"><p class="k">Sub-Saharan Africa outlook</p><p class="t">Based on the World Bank’s Global Economic Prospects, June 2026</p><div class="acts"><a class="btn p" href="https://thedocs.worldbank.org/en/doc/2b672b3b0415d6b66c45b66579db4ef5-0050012026/related/GEP-Jun-2026-Regional-Highlights-SSA.pdf" target="_blank" rel="noopener">Read the outlook</a></div></div>

</figure>
