<body>
<figure class="anim" id="a" aria-label="Two-minute video summary of Unconventional Monetary Policy, Leverage and Default Dynamics, by Edoardo Palombo">

<!-- 1 Title -->
<div class="s" style="--s:0s;--len:7s;justify-content:center">
<svg class="deco b" style="--d:.2s;top:auto;bottom:9cqw;width:30cqw" viewBox="0 0 300 160" aria-hidden="true"><path d="M0 120 L80 118 L120 116" class="ln" stroke="var(--line)" stroke-width="2"/><path class="ln dr" pathLength="1" style="--d:.8s" stroke="var(--navy)" d="M120 116 C140 110 150 30 170 26 S200 90 230 108 S280 116 300 117"/><line x1="160" y1="10" x2="160" y2="150" stroke="var(--line)" stroke-dasharray="3 4"/></svg>
<p class="k b" style="--d:.2s">QMUL Working Paper · 2020</p>
<p class="ttl b" style="--d:.5s">Unconventional Monetary Policy, Leverage and Default Dynamics</p>
<hr class="rule b" style="--d:1s">
<p class="au b" style="--d:1.2s">Edoardo Palombo</p>
<p class="cite b" style="--d:1.4s">Queen Mary University of London</p>
</div>

<!-- 2 Why it matters -->
<div class="s" style="--s:7s;--len:11s">
<p class="k">Why it matters</p>
<p class="h">In 2007, loan defaults soared to record levels</p>
<div class="row" style="grid-template-columns:.8fr 1.2fr">
<div>
<p class="p b" style="--d:.6s">Non-performing loans at US banks rose from a pre-crisis average of about 1% to over 3%.</p>
<p class="p b" style="--d:3.4s"><strong>Then came</strong> the deepest US recession since 1929: output fell by 5% and investment by 30%.</p>
</div>
<div class="b" style="--d:2s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="--h:22cqw;--r:1.8562"><div class="im"><img src="img/monet-fig1.png?v=1" width="1175" height="633" alt="Figure 1: US banks' net loan charge-off rate peaks above 3 percent in 2009-2010, far above its usual level near 1 percent"></div></div>
<p class="cap">Net loan charge-offs to total loans, US banks, % · Figure 1</p>
</div>
</div>
</div>

<!-- 3 Banks deleveraged -->
<div class="s" style="--s:18s;--len:11s">
<p class="k">The banks' response</p>
<p class="h">Banks cut their leverage hard</p>
<div class="row" style="grid-template-columns:1.2fr .8fr">
<div class="b" style="--d:.6s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="--h:25cqw;--r:1.5126"><div class="im"><img src="img/monet-fig2.png?v=1" width="900" height="595" alt="Figure 2: investment banks' leverage ratio rises to about 43 in 2007 and falls to about 22 by 2009, while large and commercial banks' leverage also falls"></div></div>
<p class="cap">Aggregated leverage ratio (assets over equity), US banks · Figure 2</p>
</div>
<div>
<p class="big b" style="--d:2s">Halved</p>
<p class="p b" style="--d:2s">investment banks' leverage ratio, on average</p>
<p class="big sm b" style="--d:4.4s;margin-top:2.2cqw">−1/3</p>
<p class="p b mu" style="--d:4.4s">commercial banks' leverage ratio</p>
<p class="cite b" style="--d:4.4s;margin-top:1.4cqw">Kalemli-Ozcan et al. (2012)</p>
</div>
</div>
</div>

<!-- 4 The policy -->
<div class="s" style="--s:29s;--len:10s">
<p class="k">The policy</p>
<p class="h">The Fed turned to credit easing</p>
<div class="row" style="grid-template-columns:.8fr 1.2fr">
<div>
<p class="p b" style="--d:.6s">With interest rates stuck at zero, the Federal Reserve began buying private, asset-backed securities.</p>
<p class="p b" style="--d:3.4s"><strong>The aim:</strong> raise asset prices, lower credit spreads and keep credit flowing to firms.</p>
</div>
<div class="b" style="--d:2s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="--h:25cqw;--r:1.4124"><div class="im"><img src="img/monet-fig3.png?v=1" width="1000" height="708" alt="Figure 3: the Federal Reserve's holdings grow from almost nothing in 2007 to about 4,000 by 2014, led by agency debt and mortgage-backed securities and long-term Treasuries"></div></div>
<p class="cap">Federal Reserve assets by type, 2007–2016, Cleveland Fed · Figure 3</p>
</div>
</div>
</div>

<!-- 5 The question -->
<div class="s ctr" style="--s:39s;--len:11s">
<p class="k">The question</p>
<p class="h" style="margin-bottom:.8cqw">Can credit easing soften a <em>financial</em> recession?</p>
<p class="cite b" style="--d:1.2s;margin-bottom:2cqw">To answer, a model must first match how banks behaved</p>
<div class="cards" style="width:84%;text-align:left">
<div class="card b" style="--d:2.2s"><h3>Standard models</h3><p>Banks lever up in a crisis (Gertler &amp; Karadi 2011). The data show the opposite.</p><svg viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path class="ln dr" pathLength="1" style="--d:2.8s" stroke="var(--grey)" d="M4 26 L70 26 C90 26 100 6 130 6 L196 8"/></svg></div>
<div class="card b" style="--d:3.6s"><h3 style="color:var(--navy)">This paper</h3><p>Loan defaults force banks to deleverage, as they did in 2007–2009.</p><svg viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path class="ln" stroke="var(--line)" stroke-dasharray="4 5" stroke-width="2" d="M70 12 L196 12"/><path class="ln dr" pathLength="1" style="--d:4.2s" stroke="var(--navy)" d="M4 12 L70 12 C90 12 100 34 130 34 L196 22"/></svg></div>
</div>
</div>

<!-- 6 Research design -->
<div class="s" style="--s:50s;--len:12s">
<p class="k">Research design</p>
<p class="h" style="margin-bottom:1.2cqw">How defaults spread through the banks</p>
<svg class="dg" viewBox="0 0 640 230" role="img" aria-label="Model mechanism: a shock lowers the value of capital, firms default on loans, banks take losses, banks deleverage through the balance sheet and lending channels, credit tightens, and output and investment fall">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--navy)"/></marker></defs>
<g class="b" style="--d:.4s"><rect class="bx" x="10" y="14" width="170" height="64" rx="10"/><text x="95" y="42">Financial shock</text><text class="sm" x="95" y="62">capital loses value</text></g>
<g class="b" style="--d:1.4s"><path class="ar" d="M182 46 H228" marker-end="url(#ah)"/><rect class="bx" x="232" y="14" width="170" height="64" rx="10"/><text x="317" y="42">Firms default</text><text class="sm" x="317" y="62">they can't repay loans</text></g>
<g class="b" style="--d:2.4s"><path class="ar" d="M404 46 H450" marker-end="url(#ah)"/><rect class="bx" x="454" y="14" width="176" height="64" rx="10"/><text x="542" y="42">Bank losses</text><text class="sm" x="542" y="62">equity must cover them</text></g>
<g class="b" style="--d:3.6s"><path class="ar" d="M542 80 V136" marker-end="url(#ah)"/><rect class="bx" x="454" y="140" width="176" height="64" rx="10"/><text x="542" y="168">Banks deleverage</text><text class="sm" x="542" y="188">balance sheet, lending</text></g>
<g class="b" style="--d:4.8s"><path class="ar" d="M452 172 H406" marker-end="url(#ah)"/><rect class="bx" x="232" y="140" width="170" height="64" rx="10"/><text x="317" y="168">Credit tightens</text><text class="sm" x="317" y="188">spreads rise</text></g>
<g class="b" style="--d:6s"><path class="ar c" d="M230 172 H184" marker-end="url(#ahc)"/><rect class="bx c" x="10" y="140" width="170" height="64" rx="10"/><text x="95" y="168" class="cl">Output, investment</text><text class="sm" x="95" y="188">fall further</text></g>
</svg>
<p class="it b" style="--d:7.6s">A general equilibrium model with a banking sector, endogenous loan defaults and a central bank that can buy private assets.</p>
</div>

<!-- 7 Main result -->
<div class="s" style="--s:62s;--len:11s">
<p class="k">Main result</p>
<p class="h">The model reproduces the crisis in the banks</p>
<div class="row fr">
<div class="b" style="--d:.6s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="--h:22cqw;--r:1.9153"><div class="im"><img src="img/monet-f5-def-lev.png?v=1" width="701" height="366" alt="Figure 5: after a financial shock the default rate jumps on impact and the banks' leverage ratio falls by about 75 percent; without defaults neither moves"></div></div>
<p class="cap">Default rate (p.p.) and bank leverage (%), red: baseline · Figure 5</p>
</div>
<div>
<p class="big b" style="--d:2s">−75%</p>
<p class="p b" style="--d:2s">fall in the banks' leverage ratio as defaults spike</p>
<p class="it b" style="--d:4.6s;margin-top:2cqw">Leverage falls in the crisis, as in the data. Without defaults, it doesn't move.</p>
</div>
</div>
</div>

<!-- 8 Amplification -->
<div class="s" style="--s:73s;--len:10s">
<p class="k">Amplification</p>
<p class="h">Defaults make the recession deeper</p>
<div class="row fr">
<div class="b" style="--d:.6s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="--h:21cqw;--r:2.0293"><div class="im"><img src="img/monet-f5-y-i.png?v=1" width="692" height="341" alt="Figure 5: output falls about 0.75 percent and investment about 6 percent, both more than in the model without defaults"></div></div>
<p class="cap">Output and investment, % deviation, red: baseline · Figure 5</p>
</div>
<div>
<p class="big b" style="--d:2s">−0.75%</p>
<p class="p b" style="--d:2s">output</p>
<p class="big sm b" style="--d:3.6s;margin-top:2cqw">−6%</p>
<p class="p b mu" style="--d:3.6s">investment</p>
<p class="it b" style="--d:5.4s;margin-top:2cqw">About a third deeper than in a model without defaults.</p>
</div>
</div>
</div>

<!-- 9 Credit easing -->
<div class="s" style="--s:83s;--len:12s">
<p class="k">Credit easing</p>
<p class="h">Credit easing does not soften the recession</p>
<div class="row fr">
<div class="b" style="--d:.6s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="--h:22cqw;--r:1.9231"><div class="im"><img src="img/monet-f6-y-assets.png?v=1" width="700" height="364" alt="Figure 6: output follows the same path with and without credit easing, while banks' own assets fall sharply under the large intervention"></div></div>
<p class="cap">Output and bank assets, % deviation, κ: size of central bank purchases · Figure 6</p>
</div>
<div>
<p class="big b" style="--d:2s">1 for 1</p>
<p class="p b" style="--d:2s">banks cut their own lending as the central bank buys assets</p>
<p class="it b" style="--d:4.6s;margin-top:2cqw">Credit supply, spreads and output stay the same. Defaults keep rising.</p>
</div>
</div>
</div>

<!-- 10 Credit subsidies -->
<div class="s" style="--s:95s;--len:12s">
<p class="k">The alternative</p>
<p class="h">Credit subsidies cut defaults, and that works</p>
<div class="row fr">
<div class="b" style="--d:.6s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="--h:22cqw;--r:1.8149"><div class="im"><img src="img/monet-f7-def-y.png?v=1" width="706" height="389" alt="Figure 7: with credit subsidies the rise in the default rate is much smaller and output falls less"></div></div>
<p class="cap">Default rate (p.p.) and output (%), θ: size of subsidy · Figure 7</p>
</div>
<div>
<p class="big b" style="--d:2s">40%</p>
<p class="p b" style="--d:2s">smaller fall in output</p>
<p class="big sm b" style="--d:3.6s;margin-top:2cqw">30%</p>
<p class="p b mu" style="--d:3.6s">smaller fall in investment, with a large subsidy</p>
<p class="it b" style="--d:5.4s;margin-top:2cqw">Fewer defaults mean banks need not deleverage as much.</p>
</div>
</div>
</div>

<!-- 11 Implications -->
<div class="s" style="--s:107s;--len:11s">
<p class="k">Implications</p>
<p class="h">What this means for crisis policy</p>
<div class="cards c3">
<div class="card b" style="--d:.6s"><span class="n">1</span><h3>Defaults drive it</h3><p>Rising loan defaults, not falling asset prices alone, push banks to deleverage.</p></div>
<div class="card b" style="--d:2s"><span class="n">2</span><h3>Easing crowds out</h3><p>Central bank asset purchases replace bank lending rather than add to it.</p></div>
<div class="card b" style="--d:3.4s"><span class="n">3</span><h3>Target defaults</h3><p>Policies that cut defaults directly, like credit subsidies, can soften the recession.</p></div>
</div>
</div>

<!-- 12 End -->
<div class="s last" style="--s:118s;justify-content:center">
<p class="k">QMUL Working Paper · 2020</p>
