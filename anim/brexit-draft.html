<body>
<figure class="anim" id="a" aria-label="Two-minute video summary of News Uncertainty in Brexit United Kingdom, by Renato Faccini and Edoardo Palombo">

<!-- 1 Title -->
<div class="s" style="--s:0s;--len:7s;justify-content:center">
<svg class="deco b" style="--d:.2s" viewBox="0 0 300 160" aria-hidden="true"><path d="M0 40 L60 52 L120 64 L160 74" class="ln" stroke="var(--line)" stroke-width="2"/><path class="ln dr" pathLength="1" style="--d:.8s" stroke="var(--navy)" d="M160 74 C190 84 220 96 250 104 S290 116 300 120"/><path class="ln" stroke="var(--grey)" stroke-dasharray="4 5" stroke-width="2" d="M160 74 L300 100"/><line x1="160" y1="10" x2="160" y2="150" stroke="var(--line)" stroke-dasharray="3 4"/></svg>
<p class="k b" style="--d:.2s">AER: Insights · 2021</p>
<p class="ttl b" style="--d:.5s">News Uncertainty in Brexit United Kingdom</p>
<hr class="rule b" style="--d:1s">
<p class="au b" style="--d:1.2s">Renato Faccini · Edoardo Palombo</p>
<p class="cite b" style="--d:1.4s">Danmarks Nationalbank · Queen Mary University of London</p>
</div>

<!-- 2 Why it matters -->
<div class="s" style="--s:7s;--len:11s">
<p class="k">Why it matters</p>
<p class="h">A sharp recession was expected</p>
<div class="row">
<div>
<p class="p b" style="--d:.6s">Before the vote, policy institutions predicted a sharp recession if Leave won. <span class="cite">(HM Treasury 2016)</span></p>
<p class="p b" style="--d:3.4s"><strong>Instead,</strong> output, employment and capital slowly fell below their pre-referendum trend.</p>
</div>
<div class="b" style="--d:3.4s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="max-height:32cqw"><div class="im"><img src="img/brexit-fig1-output.png" alt="Figure 1: UK real GDP per capita drifts below its pre-referendum trend after 2016"><span class="gap b" style="--d:5s;left:88%;top:18.8%;height:4.4%;width:3%"></span></div></div>
<p class="cap">UK real GDP per capita (log) and its pre-referendum trend · Figure 1</p>
</div>
</div>
</div>

<!-- 3 The question -->
<div class="s ctr" style="--s:18s;--len:12s">
<p class="k">The question</p>
<p class="h" style="margin-bottom:.8cqw">Does uncertainty matter for <em>the business cycle?</em></p>
<p class="cite b" style="--d:1.2s;margin-bottom:2cqw">Theory points to two very different paths</p>
<div class="cards" style="width:84%;text-align:left">
<div class="card b" style="--d:2.2s"><h3>Uncertainty shock</h3><p>Volatility about today's fundamentals. Firms pause, then catch up: a sharp, short-lived V (Bloom 2009).</p><svg viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path class="ln dr" pathLength="1" style="--d:2.8s" stroke="var(--grey)" d="M4 8 L60 8 L90 34 L120 10 L196 8"/></svg></div>
<div class="card b" style="--d:3.6s"><h3 style="color:var(--navy)">News uncertainty</h3><p>Uncertainty about fundamentals years ahead. Brexit changes them only once it happens.</p><svg viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path class="ln dr" pathLength="1" style="--d:4.2s" stroke="var(--navy)" d="M4 8 L60 8 C100 14 140 24 196 32"/></svg></div>
</div>
<p class="it b" style="--d:6.4s;margin-top:2.4cqw">So which kind of uncertainty was Brexit?</p>
</div>

<!-- 4 Setting -->
<div class="s" style="--s:30s;--len:10s">
<p class="k">The setting</p>
<p class="h">A vote, then years of uncertain negotiations</p>
<div class="tl">
<div class="ev b" style="--d:.6s"><p class="dt">June 2016</p><p>The UK votes to leave the European Union</p></div>
<div class="ev b" style="--d:1.6s"><p class="dt">August 2016</p><p>The Bank of England launches the Decision Maker Panel survey of firms</p></div>
<div class="ev b" style="--d:2.6s"><p class="dt">March 2019</p><p>First cliff edge, followed by repeated delays</p></div>
</div>
<div class="stats">
<div class="stat b" style="--d:4.2s"><p class="big">18%</p><p>chance firms gave the UK still being in the EU at the end of 2022: 9% a later exit, 9% never</p></div>
<div class="stat b" style="--d:5.4s"><p class="big">44%</p><p>average probability firms gave a no-deal exit by March 2019</p></div>
</div>
<p class="cite b" style="--d:5.4s;margin-top:1.6cqw">Decision Maker Panel, November 2017 to April 2018</p>
</div>

<!-- 5 Stakes -->
<div class="s" style="--s:40s;--len:10s">
<p class="k">The stakes</p>
<p class="h">Firms expected Brexit to cut their sales</p>
<div class="row" style="grid-template-columns:1.25fr 1fr">
<div>
<div class="bars b" style="--d:.4s">
<span class="lb">Cut of 10% or more</span><span class="tr"><span class="br c" style="--d:.8s;width:47%"></span><span class="v">17.5</span></span>
<span class="lb">Cut of less than 10%</span><span class="tr"><span class="br c" style="--d:1.1s;width:74%"></span><span class="v">27.6</span></span>
<span class="lb">Little difference</span><span class="tr"><span class="br" style="--d:1.4s;width:100%"></span><span class="v">37.2</span></span>
<span class="lb">Rise of less than 10%</span><span class="tr"><span class="br" style="--d:1.7s;width:33%"></span><span class="v">12.3</span></span>
<span class="lb">Rise of 10% or more</span><span class="tr"><span class="br" style="--d:2s;width:15%"></span><span class="v">5.4</span></span>
</div>
<p class="cap" style="text-align:left;margin-top:1.4cqw">Average probability firms attach to each effect of Brexit on their sales, % · Table 1</p>
</div>
<div>
<p class="big b" style="--d:3.6s">−7.6%</p>
<p class="p b" style="--d:3.6s">long-run GDP under a no-deal Brexit implied by these beliefs, in line with the government's central estimate</p>
<p class="big sm b" style="--d:5.4s;margin-top:2cqw">−4.5%</p>
<p class="p b mu" style="--d:5.4s">under a deal (soft Brexit)</p>
</div>
</div>
</div>

<!-- 6 Research design -->
<div class="s" style="--s:50s;--len:12s">
<p class="k">Research design</p>
<p class="h" style="margin-bottom:1.2cqw">The vote as news about the future</p>
<svg class="dg" viewBox="0 0 640 230" role="img" aria-label="Model timeline: after the vote the economy enters negotiations; each quarter Brexit happens with probability 5.8 percent, soft 51.5 percent or hard 48.5 percent, or a second referendum reverses it with probability 0.6 percent">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--navy)"/></marker></defs>
<g class="b" style="--d:.4s"><rect class="bx" x="6" y="78" width="112" height="56" rx="10"/><text x="62" y="111">Pre-vote</text></g>
<g class="b" style="--d:1.2s"><path class="ar" d="M120 106 H186" marker-end="url(#ah)"/><text class="sm" x="153" y="96">vote</text></g>
<g class="b" style="--d:1.8s"><rect class="bx c" x="190" y="72" width="150" height="68" rx="10"/><text x="265" y="103">Negotiations</text><text class="sm" x="265" y="123">uncertain timing</text><path class="ar" d="M245 70 C235 34 295 34 285 70" marker-end="url(#ah)"/><text class="sm" x="265" y="28">drags on</text></g>
<g class="b" style="--d:3.4s"><path class="ar c" d="M342 92 C380 92 390 44 430 44" marker-end="url(#ahc)"/><path class="ar c" d="M342 92 C380 92 390 112 430 112" marker-end="url(#ahc)"/><text class="sm cl" x="388" y="146" style="fill:var(--navy)">Brexit: 5.8%</text><text class="sm" x="388" y="162">a quarter</text></g>
<g class="b" style="--d:4.4s"><rect class="bx" x="434" y="18" width="196" height="52" rx="10"/><text x="532" y="42">Soft Brexit</text><text class="sm" x="532" y="60">51.5% of exits</text></g>
<g class="b" style="--d:5s"><rect class="bx" x="434" y="86" width="196" height="52" rx="10"/><text x="532" y="110">Hard Brexit</text><text class="sm" x="532" y="128">48.5% of exits</text></g>
<g class="b" style="--d:6.2s"><path class="ar" d="M265 142 V182 H430" marker-end="url(#ah)"/><rect class="bx" x="434" y="158" width="196" height="52" rx="10"/><text x="532" y="182">Remain</text><text class="sm" x="532" y="200">second referendum</text><text class="sm" x="350" y="200">0.6% a quarter</text></g>
</svg>
<p class="it b" style="--d:7.6s">Heterogeneous firms with costly, partly irreversible investment. Brexit changes their productivity only once it happens.</p>
</div>

<!-- 7 Data -->
<div class="s" style="--s:62s;--len:10s">
<p class="k">Data</p>
<p class="h">Firms' own beliefs set the uncertainty</p>
<div class="cards">
<div class="card b" style="--d:.8s"><h3 style="color:var(--navy)">Decision Maker Panel, 2017–18</h3><p>Bank of England survey of UK firms with ten or more employees. About 2,500 CFOs and CEOs give probabilities for when Brexit happens and how it affects their sales.</p></div>
<div class="card b" style="--d:2.2s"><h3 style="color:var(--navy)">ONS national accounts, 2011–18</h3><p>Output and capital per capita and the employment rate, measured against their pre-referendum trend.</p></div>
</div>
<p class="it b" style="--d:4.2s;margin-top:2.6cqw">The survey disciplines the model; the macro data test it.</p>
</div>

<!-- 8 Main result -->
<div class="s" style="--s:72s;--len:13s">
<p class="k">Main result</p>
<p class="h">The news alone explains the slowdown</p>
<div class="row fr">
<div class="b" style="--d:.6s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig"><div class="im"><img src="img/brexit-fig2-output.png" alt="Figure 2: model output response falls to about minus 1 percent by 2018, tracking the data"><span class="gap b" style="--d:3.4s;left:93.5%;top:29.6%;height:52.3%;width:3%"></span></div></div>
<p class="cap">Output, % deviation from trend: model vs data · Figure 2</p>
</div>
<div>
<p class="big b" style="--d:2s">−1%</p>
<p class="p b" style="--d:2s">output below trend three years after the vote</p>
<p class="big sm b" style="--d:4.6s;margin-top:2.2cqw">1.8%</p>
<p class="p b mu" style="--d:4.6s">of annual GDP lost in total by end-2018</p>
<p class="it b" style="--d:6.6s;margin-top:2cqw">Employment and capital follow the same gradual path.</p>
</div>
</div>
</div>

<!-- 9 What drives it -->
<div class="s" style="--s:85s;--len:11s">
<p class="k">What drives it</p>
<p class="h">Bad news, not just uncertainty, drives the fall</p>
<div class="bars" style="grid-template-columns:auto 1fr;margin-top:1cqw;font-size:1.75cqw">
<span class="lb b" style="--d:.8s">Baseline</span><span class="tr b" style="--d:.8s"><span class="br c" style="--d:1.2s;width:70%;height:3.4cqw"></span><span class="v" style="color:var(--navy)">−1.8%</span></span>
<span class="lb b" style="--d:2.8s">Uncertainty only<br><span class="cite">mean news set to zero</span></span><span class="tr b" style="--d:2.8s"><span class="br" style="--d:3.2s;width:27%;height:3.4cqw"></span><span class="v">−0.7%</span></span>
<span class="lb b" style="--d:4.8s">Bad news only<br><span class="cite">uncertainty removed</span></span><span class="tr b" style="--d:4.8s"><span class="br" style="--d:5.2s;width:70%;height:3.4cqw;background:repeating-linear-gradient(135deg,var(--navy) 0 .5cqw,transparent .5cqw 1cqw);border:1px solid var(--navy)"></span><span class="v mu">virtually identical</span></span>
</div>
<p class="cap" style="text-align:left;margin-top:1.4cqw">Cumulative fall in output by end-2018, model · Figure 3</p>
<p class="it b" style="--d:7s;margin-top:1.8cqw">Firms expected to shrink either way, so they began cutting capital straight away.</p>
</div>

<!-- 10 Duration -->
<div class="s" style="--s:96s;--len:12s">
<p class="k">Duration</p>
<p class="h">A shorter expected wait does more damage</p>
<div class="row fr">
<div class="b" style="--d:.6s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="fig" style="max-height:29cqw"><div class="im"><img src="img/brexit-fig3-output.png" alt="Figure 3: output falls further when negotiations are expected to last one year"><span class="gap b" style="--d:3.4s;left:91%;top:51.2%;height:26.3%;width:3%"></span></div></div>
<div class="leg"><span><i style="background:#1f8a4c"></i>One-year expected duration</span><span><i style="background:#c8c8c8"></i>Baseline</span><span><i style="background:#f5a623"></i>Mean news set to zero</span></div>
</div>
<div>
<p class="big b" style="--d:2s">−3.8%</p>
<p class="p b" style="--d:2s">cumulative GDP loss to end-2018 if talks were expected to last one year, against −1.8% in the baseline</p>
<p class="it b" style="--d:5s;margin-top:2cqw">With a quick resolution in sight, more firms freeze investment and wait.</p>
</div>
</div>
</div>

<!-- 11 Implications -->
<div class="s" style="--s:108s;--len:10s">
<p class="k">Implications</p>
<p class="h">What Brexit teaches about uncertainty</p>
<div class="cards c3">
<div class="card b" style="--d:.6s"><span class="n">1</span><h3>Future, not present</h3><p>Uncertainty about future fundamentals brings a gradual decline, not a V-shaped recession.</p></div>
<div class="card b" style="--d:2s"><span class="n">2</span><h3>Expected duration</h3><p>The longer uncertainty is expected to last, the smaller its near-term effect.</p></div>
<div class="card b" style="--d:3.4s"><span class="n">3</span><h3>Cliff edges</h3><p>Repeated deadlines, each expected to be decisive, do the most damage to investment.</p></div>
</div>
</div>
