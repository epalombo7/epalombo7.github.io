<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Low-income countries outlook: 1-minute outlook</title>
<link rel="stylesheet" href="../style.css?v=14">
<style>
.anim{--teal:#5fa8a0;--sand:#d9c3a0;--slate:#34424f;--deep:#1b242d;position:relative;aspect-ratio:16/9;max-width:100%;margin:0 auto;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.anim .s{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6% 8% 9%;opacity:0;animation:sl 60s linear 1 both;animation-delay:calc(var(--i)*6s)}
.anim .s.last{animation-name:sl-last}
.anim .k{margin:0 0 .5em;font-size:clamp(.65rem,2.2vw,.8rem);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.anim .t{margin:0;font-size:clamp(.95rem,3.8vw,1.85rem);line-height:1.25;font-weight:600;max-width:15em}
.anim .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:1em}
.anim .btn.p{background:var(--navy);color:var(--on-accent);border-color:var(--navy)}
.anim .sig{height:48px;width:auto;aspect-ratio:387/248;align-self:flex-start;margin:0 0 .8em}
.anim svg{position:absolute;right:4%;top:11%;width:40%;height:auto;pointer-events:none}
.anim .bg{fill:var(--slate);opacity:.4}
.anim .dk{fill:var(--deep)}.anim .sl{fill:var(--slate)}.anim .sd{fill:var(--sand)}.anim .cl{fill:var(--navy)}.anim .tl{fill:var(--teal)}.anim .sf{fill:var(--surface)}.anim .mu{fill:var(--muted)}
.anim .fg{fill:var(--sand);opacity:.2}
.anim .st{fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anim .sts{stroke:var(--sand)}.anim .stt{stroke:var(--teal)}.anim .stm{stroke:var(--muted)}.anim .stl{stroke:var(--line)}
.anim .base{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.anim .grid{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.anim .l{fill:none;stroke:var(--navy);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dr 3s ease-in-out both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
.anim .ref{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:3 3;stroke-linecap:round;stroke-linejoin:round}
.anim .tx{fill:var(--muted);font:600 9px system-ui,sans-serif}
.anim .q{fill:var(--navy);font:700 20px system-ui,sans-serif;text-anchor:middle}
.anim .in{animation:in .7s ease-out both;animation-delay:calc(var(--i)*6s + var(--d,.3s))}
.anim .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
.anim .area{animation:in 1s ease-out both;animation-delay:calc(var(--i)*6s + 3.2s)}
.anim .fl{animation:fl 3.4s ease-in-out infinite alternate}
.anim .dx{animation:dx 7s ease-in-out infinite alternate}
.anim .dy{animation:dx 9s ease-in-out infinite alternate-reverse}
.anim .sw{transform-box:fill-box;transform-origin:50% 0;animation:sw 3s ease-in-out infinite alternate}
.anim .sp{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
.anim .spr{animation-direction:reverse;animation-duration:8s}
.anim .hd{transform-box:fill-box;transform-origin:50% 100%;animation:spin 4s linear infinite}
.anim .hh{animation-duration:48s}
.anim .pu{transform-box:fill-box;transform-origin:center;animation:pu 2s ease-in-out infinite}
.anim .rise{transform-box:fill-box;transform-origin:center;animation:rise 3s ease-out infinite;animation-delay:var(--w,0s)}
.anim .fall{animation:fall 2.4s ease-in infinite;animation-delay:var(--w,0s)}
.anim .flow{stroke-dasharray:3 3;animation:flow 1s linear infinite}
.anim .bk{animation:bk 2.6s ease-in-out infinite;animation-delay:var(--w,0s)}
.anim .tv{offset-rotate:0deg;animation:tv 3s ease-in-out both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
.anim .sdt{transform-box:fill-box;transform-origin:50% 100%;animation:sdt 5s linear infinite}
.anim .sdb{transform-box:fill-box;transform-origin:50% 100%;animation:sdb 5s linear infinite}
.anim .bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--navy);transform-origin:left;animation:fill 60s linear 1 both}
.anim .rp{position:absolute;right:12px;bottom:12px;z-index:2;font:inherit;font-size:.8rem;padding:2px 12px;cursor:pointer;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--navy)}
@keyframes sl{0%{opacity:0;transform:translateY(8px)}1.5%,8.5%{opacity:1;transform:none}10%,100%{opacity:0}}
@keyframes sl-last{0%{opacity:0;transform:translateY(8px)}1.5%,100%{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes fl{to{transform:translateY(-3px)}}
@keyframes dx{to{transform:translateX(9px)}}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pu{50%{transform:scale(1.18);opacity:.6}}
@keyframes rise{from{opacity:.7;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-14px) scale(1.5)}}
@keyframes fall{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
@keyframes flow{to{stroke-dashoffset:-6}}
@keyframes bk{50%{opacity:.3}}
@keyframes tv{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes sdt{to{transform:scaleY(0)}}
@keyframes sdb{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.anim.off *{animation:none!important}
@media (prefers-reduced-motion:reduce){.anim{aspect-ratio:auto}.anim .s{position:static;opacity:1;animation:none;padding:18px 20px;border-bottom:1px solid var(--line)}.anim svg{position:static;width:min(260px,100%);margin-top:8px}.anim .l{stroke-dashoffset:0}.anim .tv{offset-distance:100%}.anim *{animation:none!important}.anim .bar,.anim .rp{display:none}}
svg{overflow:visible}
.anim .bar{padding:0;gap:0;height:4px}
/* polish: text column, source line, logo, QA freeze */
.anim .s{padding:7% 50% 12% 7%}
.anim .s.last{padding-right:8%}
.anim .k{font-size:clamp(.6rem,1.9vw,.78rem)}
.anim .t{font-size:clamp(.85rem,3.1vw,1.6rem);line-height:1.28;font-weight:600;max-width:none}
.anim .t+.t{margin-top:.5em}
.anim .src{position:absolute;left:7%;bottom:calc(4px + 2.4%);margin:0;max-width:72%;font-size:clamp(.5rem,1.45vw,.72rem);line-height:1.3;color:var(--muted);z-index:2}
.anim .logo{position:absolute;right:2.6%;bottom:calc(4px + 2%);height:9%;width:auto;aspect-ratio:387/248;z-index:2;opacity:.95}
.anim .acts{align-items:center}.anim .acts .btn{font-family:inherit;line-height:1.4}
@media (max-width:460px){.anim .acts{gap:6px;flex-wrap:nowrap;margin-top:.7em}.anim .acts .btn{font-size:.74rem;padding:4px 11px;white-space:nowrap}}
.anim.qa *{animation:none!important}.anim.qa .s{opacity:0}.anim.qa .s.on{opacity:1}.anim.qa .l{stroke-dashoffset:0}.anim.qa .tv{offset-distance:100%}
@media (prefers-reduced-motion:reduce){.anim .s{padding:18px 20px}.anim .src,.anim .logo{position:static;display:block;margin:10px 20px}}

body{background:transparent}
.anim .num{fill:var(--text);font:700 11px system-ui,sans-serif;text-anchor:middle}
.anim .gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 1.2s cubic-bezier(.3,1.2,.5,1) both;animation-delay:calc(var(--i)*6s + var(--d,1s))}
@keyframes gr{from{transform:scaleY(0)}to{transform:none}}</style>
</head>
