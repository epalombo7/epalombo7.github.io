<title>Credit Easing and Defaults: 1-minute preview</title>

<style>
.anim{--teal:#5fb3a8;--sand:#e4cfa3;--slate:#3b4654;--slate2:#232b33;--slate3:#2c3640;--gold:#e8b84a;--gold2:#a8791f;--rose:#d9645a;--cloud:#566271;--cloud2:#3f4955;position:relative;aspect-ratio:16/9;max-width:100%;margin:0 auto;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.anim .s{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6% 8% 9%;opacity:0;animation:sl 60s linear 1 both;animation-delay:calc(var(--i)*6s)}
.anim .s.last{animation-name:sl-last}
.anim .k{margin:0 0 .5em;font-size:clamp(.65rem,2.2vw,.8rem);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.anim .t{margin:0;font-size:clamp(1.05rem,3.8vw,1.9rem);line-height:1.25;font-weight:600;max-width:12em}
.anim .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:1em}
.anim .btn.p{background:var(--navy);color:var(--on-accent);border-color:var(--navy)}
.anim .sub{margin:.6em 0 0;font-size:clamp(.7rem,2.2vw,.9rem);color:var(--muted)}
.anim .sig{height:48px;width:auto;aspect-ratio:387/248;align-self:flex-start;margin:0 0 .7em}
.anim .s>svg{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:40%;height:auto;pointer-events:none;fill:none;stroke:none;stroke-linecap:round;stroke-linejoin:round}
.anim svg.d{position:absolute;width:0;height:0}
.pn{fill:var(--slate2)}.gw{fill:var(--slate);opacity:.3}.sk,.gn{fill:var(--slate3)}.gl2{stroke:var(--slate);stroke-width:1}
.bd{fill:var(--bc,var(--slate))}.rf{fill:var(--rc,var(--teal))}.sd{fill:var(--sand)}.wn{fill:var(--sand);opacity:.9}.gd{fill:var(--gold)}.g2{fill:var(--gold2)}.ac{fill:var(--navy)}.ro{fill:var(--rose)}
.pi{stroke:var(--slate);stroke-width:6}.pj{stroke:var(--slate2);stroke-width:3.4}.pf{stroke:var(--gold);stroke-width:2.6;stroke-dasharray:.1 7;animation:fl .8s linear infinite}
.tx{fill:var(--muted);font-size:7px;text-anchor:middle}
.crk{stroke:var(--rose);stroke-width:1.3;stroke-dasharray:1 2;stroke-dashoffset:1;stroke-linecap:butt}
.rn{stroke:var(--teal);stroke-width:1.1;opacity:0;animation:rn .9s linear infinite}
.fi,.pp,.up{opacity:0}
.fi,.fo,.fall,.pp,.up,.crk,.op{animation-duration:.8s;animation-fill-mode:both;animation-delay:calc(var(--i)*6s + var(--d,0s))}
.fi{animation-name:fi}.fo{animation-name:fo}.pp{transform-box:fill-box;transform-origin:50% 100%;animation-name:pop;animation-timing-function:cubic-bezier(.2,.9,.3,1.3)}
.up{animation-name:up}.crk{animation-name:crk;animation-duration:.6s}
.fall{transform-box:fill-box;transform-origin:50% 100%;animation-name:fall;animation-duration:1s;animation-timing-function:cubic-bezier(.5,0,1,.6)}
.op{transform-box:fill-box;transform-origin:50% 100%;animation-name:op;animation-timing-function:cubic-bezier(.2,.9,.3,1.3)}
.dr,.bob,.pl,.bolt,.rn{animation-delay:calc(var(--i)*6s + var(--d,0s))}
.dr{animation:dr 3.5s ease-in-out infinite alternate}.bob{animation:bob 1.6s ease-in-out infinite alternate}
.pl{transform-box:fill-box;transform-origin:50% 50%;animation:pl 1.8s ease-in-out infinite alternate}.bolt{animation:bolt 3s linear infinite}
.pf,.dr,.bob,.pl,.bolt,.rn{animation-delay:calc(var(--i)*6s + var(--d,0s))}
.anim .bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--navy);transform-origin:left;animation:fill 60s linear 1 both}
.anim .rp{position:absolute;right:12px;bottom:12px;z-index:2;font:inherit;font-size:.8rem;padding:2px 12px;cursor:pointer;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--navy)}
@keyframes sl{0%{opacity:0;transform:translateY(8px)}1%,9%{opacity:1;transform:none}10%,100%{opacity:0}}
@keyframes sl-last{0%{opacity:0;transform:translateY(8px)}1%,100%{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fo{from{opacity:1}to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fall{from{opacity:1;transform:none}to{opacity:.55;transform:translateY(3px) rotate(22deg)}}
@keyframes op{from{opacity:0;transform:scale(.2,.1)}to{opacity:1;transform:none}}
@keyframes crk{to{stroke-dashoffset:0}}
@keyframes fl{to{stroke-dashoffset:-7.1}}
@keyframes rn{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(var(--dy,40px));opacity:0}}
@keyframes dr{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes pl{from{transform:scale(1);opacity:.2}to{transform:scale(1.15);opacity:.4}}
@keyframes bolt{0%,100%{opacity:0}4%,8%{opacity:1}12%{opacity:0}16%{opacity:.9}20%{opacity:0}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim.off *{animation:none!important}
@media (prefers-reduced-motion:reduce){.anim{aspect-ratio:auto}.anim .s{position:static;opacity:1;animation:none;padding:18px 20px;border-bottom:1px solid var(--line)}.anim .s>svg,.anim .bar,.anim .rp{display:none}}
svg{overflow:visible}
.anim .bar{padding:0;gap:0;height:4px}
/* polish: text column, source line, logo, QA freeze */
.anim .s{padding:7% 50% 12% 7%}
.anim .s.last{padding-right:8%}
.anim .k{font-size:clamp(.6rem,1.9vw,.78rem)}
.anim .t{font-size:clamp(.85rem,3.1vw,1.6rem);line-height:1.28;font-weight:600;max-width:none}
.anim .t+.t{margin-top:.5em}
.anim .src{position:absolute;left:7%;bottom:calc(4px + 2.4%);margin:0;max-width:72%;font-size:clamp(.5rem,1.45vw,.72rem);line-height:1.3;color:var(--muted);z-index:2}
.anim .logo{position:absolute;right:2.6%;bottom:calc(4px + 2%);height:9%;width:auto;aspect-ratio:387/248;z-index:2;opacity:.95}
.anim.qa *{animation:none!important}.anim.qa .s{opacity:0}.anim.qa .s.on{opacity:1}.anim.qa .l{stroke-dashoffset:0}.anim.qa .tv{offset-distance:100%}
@media (prefers-reduced-motion:reduce){.anim .s{padding:18px 20px}.anim .src,.anim .logo{position:static;display:block;margin:10px 20px}}
</style>

<div class="s" style="--i:0"><p class="k">Motivation</p><p class="t">In a downturn, many firms default on their debt.</p>

<div class="s" style="--i:1"><p class="k">Research question</p><p class="t">Can central bank lending to firms stabilise the economy?</p>

<div class="s" style="--i:2"><p class="k">Mechanism</p><p class="t">Firm defaults impose losses on banks, which then cut lending.</p>

<div class="s" style="--i:3"><p class="k">Approach</p><p class="t">We build a macroeconomic model with firms, banks and a central bank.</p>

<div class="s" style="--i:4"><p class="k">Transmission</p><p class="t">Defaults rise, and bank losses cause a sharp contraction in credit.</p>

<div class="s" style="--i:5"><p class="k">Policy</p><p class="t">The central bank lends directly to firms, in place of bank credit.</p>
<svg viewBox="0 0 160 100" aria-hidden="true"><use href="#bg"/><g opacity=".3"><use href="#bk" x="72" y="48" style="--rc:var(--slate)"/></g><g transform="translate(8 36) scale(1.15)"><g class="pp" style="--d:0.3s"><use href="#cb" style="--rc:var(--navy)"/></g></g><g class="pl" style="--d:1.5s"><circle cx="129" cy="66" r="17" fill="var(--teal)"/></g><g class="fi" style="--d:1s"><path class="pi" d="M62 74H118"/><path class="pj" d="M62 74H118"/><path class="pf" d="M62 74H118"/></g><path class="fi" style="--d:1.4s" d="M112 67l8 7-8 7" stroke="var(--sand)" stroke-width="2.2"/><g transform="translate(120 52) scale(1.1)"><g class="up" style="--d:1.6s"><use href="#fb"/></g></g><g class="bob"><use href="#cn" x="26" y="26" class="pp" style="--d:2s"/></g><g class="bob" style="--d:.5s"><use href="#cn" x="40" y="20" class="pp" style="--d:2.4s"/></g></svg></div>
<div class="s" style="--i:6"><p class="k">Result · Illustrative</p><p class="t">The policy does not soften the downturn: public credit replaces private lending.</p>
